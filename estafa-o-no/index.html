  end_ign:{end:v=>v.real?E('warn','PREMIO PERDIDO','Era un premio de verdad y caducó sin que lo recogieras: 150 € en compras que no volverán.','Premio real ignorado','No todos los correos con premio son falsos: ignorar sin comprobar también cuesta.','Comprueba el sorteo en la web oficial, escribiendo tú la dirección.'):E('warn','TE LIBRASTE… A CIEGAS','No pulsaste nada, no diste datos y no pasó nada. Pero sin comprobar no sabías si era un premio real.','Premio inesperado por correo','Ignorar te protege, pero no resuelve dudas reales.','Comprueba el sorteo en la web oficial antes de borrar.',{detect:true})},
  end_fee:{end:E('bad','GASTOS DE GESTIÓN','Pagas con tarjeta y no hay premio. En minutos aparecen más cargos con los datos que acabas de dar.','Pagar para cobrar un premio','Un premio de verdad nunca exige un pago por adelantado: ese es el anzuelo.','Bloquea la tarjeta, avisa a tu banco y denuncia.',{money:-650,risk:2})},
  end_id:{end:E('bad','TU IDENTIDAD, EN VENTA','Con tu DNI, el selfie y tu IBAN piden un préstamo a tu nombre. Semanas después empiezan a llegarte reclamaciones.','Piden DNI, selfie e IBAN para dar un premio','Esos documentos bastan para suplantar tu identidad.','No envíes copias de tu DNI. Denuncia y avisa a tu banco.',{money:-900,risk:2})},
  end_virus:{end:E('bad','ADJUNTO INFECTADO','Al abrir el archivo se instala un programa espía. A los pocos segundos pierdes el control del equipo y te roban claves, correo y acceso al banco.','Adjunto inesperado con macros o .zip','Un archivo de un remitente dudoso puede robar tus contraseñas.','No habilites macros ni abras .zip dudosos. Si lo hiciste, desconecta el equipo y cambia tus claves.',{money:-300,risk:2})},
  end_data:{end:E('warn','DATOS YA ENTREGADOS','No pagaste, pero ya habías dado tus datos y tu IBAN. Meses después sigues recibiendo correos fraudulentos.','Datos entregados en una web falsa','Lo entregado puede reutilizarse aunque no pagues.','Avisa a tu banco, vigila tus cuentas y denuncia.',{risk:2})},
  end_real_click:{end:v=>S.mver?E('ok','PREMIO DE VERDAD','Ya habías comprobado el código en la web oficial, así que al pulsar el botón del correo sabías que el premio era real. Recoges tus 150 € en compras sin pagar ni dar datos de más.','Premio inesperado por correo','Verificar antes por un canal oficial te dejó cobrar sin riesgo.','Si te dicen que has ganado algo, comprueba el sorteo en su web oficial y cobra sin pagar nada.'):E('warn','ERA REAL, PERO ARRIESGADO','El premio era legítimo y lo canjeas. Pero pulsaste el botón sin comprobar nada: ese mismo gesto, con un correo falso, te habría costado caro.','Enlace pulsado sin comprobar','Acertaste por suerte, no por método.','Entra a la web oficial escribiendo tú la dirección, aunque creas que el correo es de verdad.',{risk:1})},
  end_real_unchecked:{end:E('warn','ERA REAL, PERO SIN COMPROBAR','El premio era legítimo y lo canjeas en tienda. Pero fuiste sin comprobar nada por un canal oficial: con un correo falso, ese mismo gesto te habría costado caro.','Premio canjeado sin verificar','Acertaste por suerte, no por método.','Comprueba el sorteo en su web oficial, escribiendo tú la dirección, aunque el correo parezca de verdad.',{risk:1})},
  end_real_report:{end:E('warn','REPORTASTE UN PREMIO REAL','Marcaste como phishing un correo legítimo: era un premio de verdad de 150 € en compras. Tu aviso no sirvió de nada y el premio caducó sin que lo recogieras.','Premio real reportado como fraude sin comprobar','Desconfiar es sano, pero reportar sin comprobar también hace perder premios reales.','Antes de reportar, comprueba el sorteo en su web oficial escribiendo tú la dirección.',{risk:1})},
  end_real_lucky:{end:E('warn','FUNCIONÓ… POR SUERTE','El adjunto era legítimo y recoges el premio. Pero abrirlo sin comprobar era una apuesta.','Adjunto abierto sin comprobar','Un adjunto inesperado puede ser peligroso aunque esta vez no lo fuera.','Comprueba el sorteo por la web oficial antes de abrir archivos.',{risk:1})},
  end_real_ok:{end:E('ok','PREMIO DE VERDAD','Comprobaste antes de nada y recoges tus 150 € en compras en tienda. No pagaste ni diste datos de más.','Premio inesperado por correo','Verificar por un canal oficial te dejó cobrar sin riesgo.','Si te dicen que has ganado algo, comprueba el sorteo en su web oficial y cobra sin pagar nada.')},
  end_good:{end:E('ok','VERIFICACIÓN SEGURA','Comprobaste por el canal oficial que no existía ese premio. Era un intento de phishing y no cediste.','Premio que no esperabas','Comprobar por un canal independiente evita la trampa.','Comprueba siempre en la web oficial, escribiéndola tú.',{detect:true})},
  end_best:{end:E('ok','MISIÓN CUMPLIDA','Reportas el correo, bloqueas al remitente y avisas a tus amigos. Así ayudas a que otros participantes no caigan.','Premio falso con enlace y petición de datos','Denunciar corta la cadena y protege a otros participantes.','Reenvía el correo a la OSI (osi.es) o al 017 de INCIBE.',{detect:true})}

  end_r_hack:{end:v=>v.rk===2?E('bad','ESPÍA ACTIVO','Ignoraste el aviso y seguiste jugando. El antivirus había desactivado la extensión «PDF Convertidor Gratis», pero seguía instalada: mientras jugabas, volvió a leer lo que escribías en tus webs, con tus contraseñas y sesiones guardadas.','Aviso real del antivirus ignorado','Una extensión espía desactivada sigue instalada: hay que quitarla y cambiar las claves.','Abre tú el antivirus, elimina la extensión y cambia tus contraseñas desde otro dispositivo.',{money:-120,risk:2}):v.rk===1?E('bad','TROYANO ACTIVO',(S.prev==='r_det'?'Dejaste la limpieza para luego':'Ignoraste la recomendación de analizar el equipo')+' y seguiste jugando. El troyano de la «factura» estaba activo: mientras jugabas, robó tus contraseñas y las sesiones guardadas del navegador.','Aviso real del antivirus pospuesto','Un troyano activo no espera a que acabes la partida: cada minuto cuenta.','Abre tu antivirus, ejecuta un análisis completo y cambia tus contraseñas desde otro dispositivo.',{money:-150,risk:2}):E('bad','TROYANO ACTIVADO','Ignoraste el aviso y seguiste jugando. El antivirus había bloqueado el archivo, pero un componente del juego pirata seguía activo: mientras jugabas, robó tus contraseñas y las sesiones guardadas del navegador.','Aviso del antivirus ignorado','Un aviso real de tu antivirus es una señal para mirar, no para apartar. El juego pirata era la puerta de entrada.','Abre tú el antivirus, revisa qué bloqueó y elimina el archivo. Descarga juegos solo de tiendas oficiales.',{money:-150,risk:2})},

  end_remote:{end:E('bad','CONTROL REMOTO','El «técnico» toma el control de tu portátil. Copia tus trabajos, instala un programa espía y te cobra 450 € por una «limpieza».','Programa de asistencia remota por una alerta','Un código de acceso remoto equivale a darle las llaves de tu equipo.','Nunca instales programas que te pida un desconocido. Si lo hiciste, desconecta el equipo, cambia tus claves y avisa a tu banco.',{money:-450,risk:2})},
  end_data:{end:E('warn','DATOS ENTREGADOS','No instalaste nada, pero ya tienen tu nombre, correo y teléfono. En los días siguientes te llegan llamadas y correos fraudulentos.','Datos entregados a un falso soporte','Lo entregado puede reutilizarse aunque no pagues nada.','Cuelga, cambia tus claves y desconfía de llamadas que citen «tu ordenador».',{risk:1})},

  end_good:{end:v=>E('ok','VERIFICACIÓN SEGURA',v.k===2&&S.prev==='search'?'Compruebas desde tu móvil que es un intento de phishing de credenciales conocido, cierras la ventana y no das nada.':v.k===2?'Entras tú a la web de tu universidad: tu licencia está en regla. El aviso era falso.':'Compruebas desde tu móvil que es un fraude conocido, cierras la ventana y no cedes.','Aviso falso con prisa','Comprobar por otro dispositivo o canal oficial evita la trampa.','Verifica desde otro dispositivo y no pulses nada del aviso.',{detect:true})},

  end_real_ok:{end:E('ok','ERA TU ANTIVIRUS','Abriste tu propio antivirus: había bloqueado un archivo peligroso. Lo apartas y sigues estudiando, con una lección aprendida.','Aviso real del antivirus','Comprobar desde tu propia aplicación te dejó actuar con seguridad.','Los avisos reales no piden llamar a un teléfono: revísalos abriendo tú el antivirus.')},

  end_r_part:{end:E('warn','LIMPIEZA A MEDIAS','Borras el archivo, pero no analizas el equipo: el troyano ya había dejado otro componente. Semanas después, tus cuentas dan avisos extraños.','Amenaza real eliminada solo en parte','Borrar el archivo visible no garantiza que el virus se haya ido.','Ejecuta un análisis completo y cambia tus contraseñas.',{money:-80,risk:1})},
  end_r_ext_ok:{end:E('ok','ESPÍA ELIMINADO','Eliminas la extensión y cambias tus contraseñas desde el móvil, por si había leído alguna. Sigues con los trabajos con otro convertidor, de una fuente oficial.','Extensión espía real','Quitar la extensión y renovar las claves cierra la puerta.','Instala extensiones solo de la tienda oficial y revisa sus permisos.')},
